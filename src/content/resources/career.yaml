title: Careers & Interviews
tagline: Land the internship, then the job.
description: Resumes, interview prep, job boards and hackathons for students heading into their first tech role. Start early; most of this takes months, not weeks.
order: 15
path:
  - title: Write a one-page resume
    note: Keep it simple, show projects and impact.
    resources: [resume-guide]
  - title: Practise coding problems
    note: Learn the patterns, not hundreds of random questions.
    resources: [neetcode, leetcode]
  - title: Learn system design basics
    resources: [system-design-primer]
  - title: Prepare for the whole interview
    note: Behavioural rounds and negotiation matter too.
    resources: [tech-interview-handbook]
  - title: Build and show your work
    note: Hackathons give you projects, teammates and contacts.
    resources: [devfolio, mlh]
