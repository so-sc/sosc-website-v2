title: Blockchain & Web3
tagline: Learn how blockchains work and build on them.
description: From hashes and consensus to writing, testing and securing smart contracts. Developer-focused, no trading or tokens to buy.
order: 13
path:
  - title: How blockchains work
    note: Hashes, blocks and consensus before any code.
    resources: [bitcoin-whitepaper, ethereum-org-learn, anders-blockchain-demo]
  - title: Write your first contract
    resources: [cryptozombies, solidity-docs]
  - title: Learn a real dev workflow
    note: Structured courses that use modern tooling.
    resources: [cyfrin-updraft, foundry-book]
  - title: Think like an attacker
    resources: [ethernaut, damn-vulnerable-defi]
  - title: Build and ship
    resources: [ethglobal]
resources:
  - title: "Bitcoin: A Peer-to-Peer Electronic Cash System"
