title: CS Fundamentals
tagline: How computers, systems and algorithms actually work.
description: The theory behind everything else. Hardware, operating systems, networks and algorithms, from free university-grade material.
order: 1
path:
  - title: How computers work
    note: From logic gates to a working machine.
    resources: [crash-course-cs, nand2tetris]
  - title: Programming foundations
    resources: [cs50x]
  - title: Systems
    note: Operating systems and networking, the layer your code runs on.
    resources: [ostep, beej-networking]
  - title: Algorithms
    resources: [mit-6006]
  - title: Build your own curriculum
    note: Self-taught degree plans when you want to go all the way.
    resources: [teach-yourself-cs, ossu]
