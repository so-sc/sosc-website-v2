    link: https://bitcoin.org/bitcoin.pdf
    description: Satoshi's original nine-page whitepaper. Short, readable and the starting point for everything else.
    type: article
    tags: [bitcoin, fundamentals]
  - title: Ethereum.org Learn Hub
    id: ethereum-org-learn
    link: https://ethereum.org/learn/
    description: Plain-language explainers on Ethereum, wallets, accounts and how the network works.
