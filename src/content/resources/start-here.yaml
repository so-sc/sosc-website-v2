title: Start Here
tagline: The first steps, whatever you end up building.
description: The tools, habits and big-picture maps every track assumes you have. Work through the path once, then pick a track.
order: 0
path:
  - title: See the whole map
    note: Get a feel for what's out there before you commit to anything.
    resources: [roadmap-sh, cs50x]
  - title: Get comfortable with your tools
    note: The terminal, your editor and the command line come up everywhere.
    resources: [missing-semester, linux-command-line]
  - title: Learn Git
    note: Every team, internship and open-source project uses it.
    resources: [learn-git-branching, pro-git]
  - title: Learn how to learn
    note: How to study effectively and how to ask for help so people answer.
    resources: [learning-how-to-learn, smart-questions]
  - title: Grab the free stuff
    note: Then pick a track below and keep going.
    resources: [github-student-pack]
resources:
  - title: Roadmap.sh
    id: roadmap-sh
    link: https://roadmap.sh
