title: Programming Languages
tagline: Learn a language properly, then pick up the next one.
description: Official tutorials, free books and practice sites for the languages students use most. Learn one well first, the rest come faster.
order: 12
path:
  - title: Pick a first language
    note: Python is the easiest start; C if your syllabus needs it.
    resources: [python-tutorial, cs50p]
  - title: Learn it properly
    note: Work through a complete book or tutorial, not just videos.
    resources: [automate-boring-stuff, learncpp]
  - title: Practise every day
    resources: [exercism]
  - title: Learn a second language
    note: A different style teaches you something new.
    resources: [javascript-info, rust-book, tour-of-go]
