title: Game Development
tagline: Make games people want to play.
description: Pick an engine, ship your first game in a jam, then go deeper into patterns and graphics.
order: 11
path:
  - title: Pick an engine
    note: Godot is free and open source. Unity has the most tutorials.
    resources: [godot-docs, unity-learn]
