title: Embedded & IoT
tagline: Make hardware that senses, thinks and talks.
description: From blinking an LED to firmware, real-time operating systems and connected devices. Electronics, microcontrollers, PCBs and robotics.
order: 14
path:
  - title: Electronics basics
    note: Voltage, current and reading a circuit.
    resources: [sparkfun-learn, tinkercad-circuits]
  - title: Your first microcontroller
    note: Blink an LED, read a sensor. Try it in a simulator first.
    resources: [arduino-docs, wokwi]
  - title: Connect it to the internet
    resources: [random-nerd-tutorials, mqtt-org]
  - title: Go deeper into firmware
    note: Embedded C, registers and real-time operating systems.
    resources: [esp-idf-docs, freertos-docs]
  - title: Design your own board
    resources: [kicad-docs, phils-lab]
